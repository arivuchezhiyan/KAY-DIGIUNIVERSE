    <style>
        .thankyou-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfdfd;
            text-align: center;
            padding: 20px;
        }
        
        .thankyou-box {
            background: #fff;
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            border: 1px solid #f1f5f9;
        }
        
        .thankyou-icon {
            font-size: 5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }
        
        .thankyou-box h1 {
            font-size: 2.5rem;
            color: #0f172a;
            margin-bottom: 15px;
        }
        
        .thankyou-box p {
            font-size: 1.1rem;
            color: #475569;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary-gradient);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(98, 86, 237, 0.3);
            color: white;
        }
    </style>
